<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cenkbot benchmark · cenker.dev</title><meta name="description" content="Cenkbot için model seçimi, yanıt denetimi ve sürüm karşılaştırmaları."><link rel="stylesheet" href="/cenkbot/assets/style.css"><script src="/cenkbot/assets/app.js" defer></script></head>
<body class="benchmark-page"><main>
<nav aria-label="ana gezinme"><a href="/cenkbot">cenkbot</a><a href="https://github.com/cenkergultekin/cenkbot">github</a></nav>
<header class="benchmark-intro"><h1>benchmark</h1></header>
<p id="status" role="status">Sonuçlar yükleniyor.</p><div id="results" hidden>
<section aria-labelledby="models-heading"><div class="editorial-heading"><h2 id="models-heading">modeller</h2><p>aynı sorular, aynı konuşma yapısı.</p></div>
<div id="model-tabs" class="metric-tabs" role="tablist" aria-label="model karşılaştırması"><button id="metric-pass" role="tab" aria-selected="true" aria-controls="model-panel" data-metric="pass">test başarısı</button><button id="metric-speed" role="tab" aria-selected="false" aria-controls="model-panel" data-metric="speed" tabindex="-1">yanıt süresi</button><button id="metric-cost" role="tab" aria-selected="false" aria-controls="model-panel" data-metric="cost" tabindex="-1">maliyet</button></div>
<figure id="model-panel" class="benchmark-figure" role="tabpanel" aria-labelledby="metric-pass"><div class="figure-heading"><h3 id="model-title"></h3><span id="model-scope"></span></div><div id="model-chart" class="comparison-chart"></div><figcaption id="model-caption"></figcaption></figure>
<p id="model-insight" class="insight"></p></section>
<section aria-labelledby="gate-heading"><div class="editorial-heading"><h2 id="gate-heading">yanıt denetimi</h2><p>Jev ve düzeltme, aynı modelde neyi değiştiriyor?</p></div>
<div id="gate-tabs" class="metric-tabs" role="tablist" aria-label="denetim karşılaştırması"><button id="gate-pass" role="tab" aria-selected="true" aria-controls="gate-panel" data-gate="pass">mekanizmalar</button><button id="gate-correction" role="tab" aria-selected="false" aria-controls="gate-panel" data-gate="correction" tabindex="-1">düzeltme etkisi</button></div>
<figure id="gate-panel" class="benchmark-figure" role="tabpanel" aria-labelledby="gate-pass"><div class="figure-heading"><h3 id="gate-title"></h3><label class="sr-only" for="gate-model">denetim modeli</label><select id="gate-model"></select></div><div id="gate-chart" class="comparison-chart"></div><figcaption id="gate-caption"></figcaption></figure>
<p id="gate-insight" class="insight"></p></section>
<section aria-labelledby="version-heading"><div class="editorial-heading"><h2 id="version-heading">sürümler</h2><p>önceki sürüme göre ölçülen fark.</p></div>
<figure class="benchmark-figure"><div class="figure-heading"><h3>test başarısı</h3><label class="sr-only" for="version-model">sürüm karşılaştırması modeli</label><select id="version-model"></select></div><div id="version-chart" class="comparison-chart"></div><figcaption id="version-caption"></figcaption></figure>
<p id="version-insight" class="insight"></p><p id="release-note" class="footnote"></p></section>
</div><footer><span id="review-note">otomatik testler · insan değerlendirmesi henüz yok</span><a href="https://github.com/cenkergultekin/cenkbot/blob/codex/cenkbot-foundation/docs/evaluation.md">yöntem ve sonuçlar</a></footer>
</main></body></html>
